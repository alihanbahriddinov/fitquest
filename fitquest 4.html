<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <title>FitQuest — прокачай себя</title>
  <style>
:root{
  --bg:#0f1222;--card:#1a1f3a;--card2:#242b4f;--txt:#eef0ff;--mut:#9aa3d1;
  --acc:#7c5cff;--acc2:#00d4a6;--gold:#ffb547;--bad:#ff5c7a;--line:#2e3563;
  --r:18px;
}
[data-theme="light"]{
  --bg:#f2f4ff;--card:#ffffff;--card2:#e8ebff;--txt:#1b1f3b;--mut:#5b6390;--line:#d5daf5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:84px}
h2,h3,h4{margin:0 0 10px}
h2{font-size:20px}h3{font-size:16px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:13px}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:linear-gradient(90deg,var(--card),var(--card2));border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}
.chips{display:flex;gap:8px}
.chip{background:var(--card2);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid var(--line)}
.chip.gold{color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.between{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.center{text-align:center}

/* buttons / inputs */
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s,opacity .2s}
button:active{transform:scale(.96)}
button.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
button.ok{background:var(--acc2);color:#04241d}
button.bad{background:var(--bad)}
button.gold{background:var(--gold);color:#3a2600}
button.sm{padding:6px 10px;font-size:13px;border-radius:10px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.chipbtn{padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600}
.chipbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* hero */
.hero{display:flex;gap:14px;align-items:center}
.avatar{width:130px;height:156px;flex:none;border-radius:20px;background:radial-gradient(circle at 50% 30%,var(--card2),var(--bg));
  border:2px solid var(--acc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:180px;height:216px;margin:10px auto}
.bubble{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px;margin-top:8px;position:relative}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),#ff7a45)}
.bar.red>i{background:var(--bad)}
.lvl{font-size:26px;font-weight:900}

/* quests / lists */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;background:transparent}
.done .chk{background:var(--acc2);border-color:var(--acc2);color:#04241d}
.rew{font-size:12px;color:var(--gold);white-space:nowrap;font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}

/* ring */
.ring{position:relative;width:200px;height:200px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:34px;font-weight:900}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars b{display:block;background:linear-gradient(var(--acc2),var(--acc));border-radius:8px 8px 0 0;min-height:3px}

/* timer */
.timer{font-size:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}

/* ex card */
.ex{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:10px}
.ex .nm{font-weight:800}
.ex .inp{display:flex;gap:8px;margin-top:8px;align-items:center}
.ex .inp input{width:70px;text-align:center}

/* shop */
.shopitem{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.shopitem .em{font-size:38px}
.price{color:var(--gold);font-weight:800;margin:6px 0}

/* achievements & chars */
.ach{padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:12px}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach .em{font-size:28px}
.charcard{border:2px solid var(--line);border-radius:16px;background:var(--card2);padding:8px;text-align:center;font-size:12px;cursor:pointer}
.charcard.on{border-color:var(--acc2)}
.charcard.lock{opacity:.35;filter:grayscale(1);cursor:default}
.charcard .avatar{width:100%;height:110px;border-width:1px;border-radius:12px}
.meal{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.meal img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro b{display:block;font-size:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:transparent;color:var(--mut);padding:6px 2px;font-size:10px;font-weight:700;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}
.nav button.on{color:#fff;background:var(--acc)}

/* toasts / modal */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--acc2);color:#04241d;font-weight:700;padding:10px 14px;border-radius:12px;box-shadow:0 6px 24px #0006;animation:pop .25s}
.modal{position:fixed;inset:0;z-index:50;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal .box{background:var(--card);border:2px solid var(--acc);border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center;animation:pop .3s}
.modal .big{font-size:44px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:720px){.nav{max-width:720px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}

</style>
</head>
<body>
  <header class="top">
    <div class="brand">⚔️ FitQuest</div>
    <div class="chips">
      <span class="chip" id="hLvl">Ур. 1</span>
      <span class="chip gold" id="hCoins">🪙 0</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="nav" id="nav"></nav>

  <div id="toasts"></div>
  <div id="modal" class="modal hidden"></div>

  <input type="file" id="mealPhoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="charImg" accept="image/*" hidden>
  <input type="file" id="importFile" accept="application/json" hidden>

  <script>
'use strict';
/* =====================================================================
   FitQuest — геймифицированный фитнес-трекер.
   Всё хранится локально в браузере (localStorage).
   Настройки баланса — в объекте CFG ниже.
   ===================================================================== */
const CFG = {
  xpBase: 30,        // XP до 2-го уровня
  xpGrow: 0.6,       // на сколько растёт требование каждый уровень
  maxLevel: 2000,
  charEvery: 50,     // новый герой каждые N уровней
  stepXp: 100,       // 1 XP за столько шагов
  stepCoin: 500,     // 1 монета за столько шагов
};
const KEY = 'fitquest_v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const rnd = a => a[Math.floor(Math.random() * a.length)];

/* ---------------------------- состояние ---------------------------- */
const defaults = () => ({
  v: 1, name: 'Герой', xp: 0, coins: 0, active: 0, customImg: {}, stepGoal: 8000,
  goals: { kcal: 2200, p: 130, f: 70, c: 250 },
  days: {}, meals: [], workouts: [], reading: [], weights: [], notes: {},
  inventory: {}, customShop: [], quests: {}, ach: {}, lastBonus: '', bought: 0,
  settings: { theme: 'dark', apiUrl: '' },
});
let S = load();
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (!r) return defaults();
    const d = defaults();
    return Object.assign(d, r, { settings: Object.assign(d.settings, r.settings || {}), goals: Object.assign(d.goals, r.goals || {}) });
  } catch (e) { return defaults(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Память браузера заполнена — удали старые фото еды'); }
}
function D(k = dateKey()) {
  return S.days[k] || (S.days[k] = { steps: 0, sx: 0, sc: 0, water: 0, sleep: 0, read: 0, train: 0, meals: 0, xp: 0 });
}
const peek = (k = dateKey()) => S.days[k] || {};

/* ----------------------------- уровни ----------------------------- */
const need = l => CFG.xpBase + Math.floor(l * CFG.xpGrow);
function levelInfo(xp) {
  let l = 1;
  while (l < CFG.maxLevel && xp >= need(l)) { xp -= need(l); l++; }
  return { level: l, cur: xp, next: l >= CFG.maxLevel ? 1 : need(l) };
}
const unlockedCount = lvl => UNL.filter(u => u <= lvl).length;

/* ---------------------------- персонажи ---------------------------- */
const HEROES = [
  ['Рэн', 'Обычный герой'], ['Мира', 'Ученица клинка'], ['Торн', 'Страж тропы'], ['Лиара', 'Бегунья ветра'], ['Дзиро', 'Мастер дыхания'],
  ['Кай', 'Кузнец силы'], ['Ниро', 'Тень рассвета'], ['Сэра', 'Хранительница света'], ['Брок', 'Каменный кулак'], ['Юна', 'Лунный лучник'],
  ['Вальд', 'Железный лесник'], ['Иска', 'Стальной шторм'], ['Гром', 'Громовой атлет'], ['Тесса', 'Гибкая молния'], ['Аргус', 'Зоркий воин'],
  ['Мако', 'Волна прибоя'], ['Зара', 'Пустынный ураган'], ['Орин', 'Горный монах'], ['Фрея', 'Ледяная валькирия'], ['Даро', 'Король марафона'],
  ['Омега', 'Легенда 2000 уровня'],
];
const DEMONS = [
  ['Гар', 'Обычный демон'], ['Скарн', 'Демон-мародёр'], ['Визг', 'Клыкастый демон'], ['Морок', 'Теневой демон'], ['Кроар', 'Рогатый демон'],
  ['Шипа', 'Ядовитая демоница'], ['Балор', 'Каменный демон'], ['Нокс', 'Ночной охотник'], ['Вейра', 'Демоница лунной тьмы'], ['Урзак', 'Кровавый демон'],
  ['Малгрим', 'Старший демон'], ['Ксара', 'Демоница теней'], ['Грим', 'Костяной демон'], ['Леви', 'Демон бурь'], ['Азок', 'Верховный демон'],
  ['Тарна', 'Демоница льда'], ['Дракс', 'Демон-великан'], ['Некра', 'Королева тьмы'], ['Охр', 'Древний демон'], ['Кайрос', 'Повелитель демонов'],
];
// чётные номера — герои, нечётные — демоны; уровни открытия: 1, 10, 25, 50, 75, 100 ... 2000
const CHARS = Array.from({ length: 41 }, (_, i) => i % 2 === 0 ? HEROES[i / 2] : DEMONS[(i - 1) / 2]);
const isDemon = i => i % 2 === 1;
const UNL = Array.from({ length: 41 }, (_, i) => i < 6 ? [1, 10, 25, 50, 75, 100][i] : Math.round((100 + (i - 5) * 1900 / 35) / 5) * 5);
function charSVG(i) {
  const dem = isDemon(i);
  const h = (i * 47 + 20) % 360, h2 = (h + 170) % 360;
  const skin = dem ? ['#b9a3d9', '#d98a8a', '#8fb3c9', '#9ccf9a', '#c9b08f'][(i >> 1) % 5] : ['#ffe0c7', '#f5c9a1', '#e0a979', '#b57a50', '#8a5a3a'][(i * 3) % 5];
  const hair = `hsl(${h},65%,${28 + (i * 11) % 32}%)`, hairD = `hsl(${h},65%,${18 + (i * 11) % 25}%)`;
  const suit = `hsl(${h2},55%,48%)`, suitD = `hsl(${h2},55%,34%)`, trim = `hsl(${(h2 + 50) % 360},85%,68%)`;
  const st = i % 6, eye = i % 3, acc = (i >> 1) % 5;
  let back = '', front = '';
  switch (st) {
    case 0: front = `<path d="M52 70 L58 30 L72 58 L85 22 L100 55 L115 22 L128 58 L142 30 L148 70 Q100 50 52 70Z" fill="${hair}"/>`; break;
    case 1: back = `<ellipse cx="100" cy="78" rx="55" ry="52" fill="${hairD}"/>`; front = `<path d="M50 75 Q60 35 100 35 Q140 35 150 75 Q125 55 100 62 Q75 55 50 75Z" fill="${hair}"/>`; break;
    case 2: back = `<rect x="46" y="55" width="108" height="110" rx="40" fill="${hairD}"/>`; front = `<path d="M48 80 Q55 32 100 32 Q145 32 152 80 Q120 52 100 60 Q80 52 48 80Z" fill="${hair}"/>`; break;
    case 3: front = `<path d="M90 20 Q100 5 110 20 L112 62 L88 62Z" fill="${hair}"/><path d="M54 74 Q60 52 90 55 L90 66 Q70 60 54 74Z M146 74 Q140 52 110 55 L110 66 Q130 60 146 74Z" fill="${hairD}"/>`; break;
    case 4: back = `<circle cx="100" cy="22" r="17" fill="${hairD}"/>`; front = `<path d="M50 78 Q55 33 100 33 Q145 33 150 78 Q122 58 100 64 Q78 58 50 78Z" fill="${hair}"/>`; break;
    default: front = `<path d="M48 82 Q48 30 100 30 Q152 30 152 82 L140 66 Q100 48 60 66Z" fill="${hair}"/>`;
  }
  const eyes = eye === 0
    ? `<ellipse cx="82" cy="92" rx="7" ry="9" fill="#fff"/><ellipse cx="118" cy="92" rx="7" ry="9" fill="#fff"/><circle cx="83" cy="94" r="5" fill="#222"/><circle cx="117" cy="94" r="5" fill="#222"/><circle cx="85" cy="91" r="1.8" fill="#fff"/><circle cx="119" cy="91" r="1.8" fill="#fff"/>`
    : eye === 1
      ? `<path d="M73 86 L91 90 M127 86 L109 90" stroke="#222" stroke-width="3" stroke-linecap="round"/><circle cx="83" cy="95" r="5" fill="#222"/><circle cx="117" cy="95" r="5" fill="#222"/>`
      : `<path d="M74 95 Q82 85 90 95 M110 95 Q118 85 126 95" stroke="#222" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  let accs = '';
  if (acc === 1) accs = `<rect x="54" y="62" width="92" height="9" rx="4" fill="${trim}"/>`;
  if (acc === 2) accs = `<g fill="none" stroke="#222" stroke-width="2.5"><circle cx="82" cy="93" r="12"/><circle cx="118" cy="93" r="12"/><path d="M94 93 H106"/></g>`;
  if (acc === 3) accs = `<path d="M124 100 L136 116" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>`;
  const demEyes = `<ellipse cx="82" cy="92" rx="8" ry="9" fill="#ffe14d"/><ellipse cx="118" cy="92" rx="8" ry="9" fill="#ffe14d"/><rect x="80.8" y="83" width="2.6" height="17" rx="1.3" fill="#2a0a0a"/><rect x="116.8" y="83" width="2.6" height="17" rx="1.3" fill="#2a0a0a"/><path d="M71 81 L92 88 M129 81 L108 88" stroke="#2a0a0a" stroke-width="4" stroke-linecap="round"/><path d="M66 102 L75 106 M134 102 L125 106" stroke="#5b2a7a" stroke-width="3" stroke-linecap="round"/>`;
  const horns = `<path d="M64 54 Q48 24 66 6 Q64 34 80 46Z" fill="#f1ead8" stroke="#8a7a55" stroke-width="1.5"/><path d="M136 54 Q152 24 134 6 Q136 34 120 46Z" fill="#f1ead8" stroke="#8a7a55" stroke-width="1.5"/>${i >= 21 ? '<path d="M52 66 Q30 52 34 34 Q46 52 60 58Z" fill="#f1ead8" stroke="#8a7a55" stroke-width="1.5"/><path d="M148 66 Q170 52 166 34 Q154 52 140 58Z" fill="#f1ead8" stroke="#8a7a55" stroke-width="1.5"/>' : ''}`;
  const fangs = `<path d="M91 113 L95 123 L99 114Z M101 114 L105 123 L109 113Z" fill="#fff" stroke="#8a2b2b" stroke-width="1"/>`;
  const cape = acc === 4 ? `<path d="M62 134 L36 218 L164 218 L138 134Z" fill="${trim}" opacity=".9"/>` : '';
  return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    ${cape}${back}
    <rect x="74" y="196" width="20" height="34" rx="8" fill="${suitD}"/><rect x="106" y="196" width="20" height="34" rx="8" fill="${suitD}"/>
    <rect x="70" y="224" width="28" height="12" rx="6" fill="#222"/><rect x="102" y="224" width="28" height="12" rx="6" fill="#222"/>
    <rect x="64" y="130" width="72" height="72" rx="22" fill="${suit}"/>
    <rect x="64" y="176" width="72" height="9" fill="${trim}"/>
    <path d="M100 132 L100 176" stroke="${suitD}" stroke-width="3"/>
    <rect x="42" y="136" width="24" height="52" rx="12" fill="${suit}"/><rect x="134" y="136" width="24" height="52" rx="12" fill="${suit}"/>
    <circle cx="54" cy="192" r="11" fill="${skin}"/><circle cx="146" cy="192" r="11" fill="${skin}"/>
    <g transform="translate(26 196)"><rect y="6" width="56" height="5" rx="2" fill="#aaa"/><rect width="9" height="17" rx="3" fill="#444"/><rect x="47" width="9" height="17" rx="3" fill="#444"/></g>
    <rect x="90" y="122" width="20" height="16" fill="${skin}"/>
    <circle cx="100" cy="88" r="44" fill="${skin}"/>
    ${front}${dem ? demEyes : eyes}${accs}${dem ? horns : ''}
    <ellipse cx="70" cy="108" rx="7" ry="4" fill="#ff8aa0" opacity=".45"/><ellipse cx="130" cy="108" rx="7" ry="4" fill="#ff8aa0" opacity=".45"/>
    <path d="M88 112 Q100 124 112 112" stroke="#8a2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>${dem ? fangs : ''}
  </svg>`;
}
const charImg = i => S.customImg[i] ? `<img src="${S.customImg[i]}" alt="">` : charSVG(i);
const PHRASES = {
  idle: ['Готов к новым подвигам!', 'Сегодня будет отличный день!', 'Каждый шаг делает нас сильнее.', 'Не останавливайся!', 'Железо не поднимет само себя 💪'],
  low: ['Давай начнём с малого — хотя бы 10 приседаний!', 'Разминка — и дело пойдёт.', 'Первый шаг самый важный!'],
  mid: ['Отлично идём! Ещё чуть-чуть.', 'Квесты сами себя не закроют 😉', 'Ты в ритме!'],
  high: ['Ты машина! 🔥', 'Сегодня ты на высоте!', 'Легенда в процессе создания!'],
};

/* ------------------------------- XP --------------------------------- */
function gain(xp, coins = 0, why = '', quiet = false) {
  const before = levelInfo(S.xp).level;
  S.xp += xp; S.coins += coins; D().xp += xp;
  const after = levelInfo(S.xp).level;
  if (!quiet && (xp || coins)) toast(`+${xp} XP${coins ? ` · +${coins} 🪙` : ''}${why ? ' — ' + why : ''}`);
  if (after > before) {
    let newChar = null;
    for (let l = before + 1; l <= after; l++) { const ni = UNL.indexOf(l); if (ni > 0) newChar = ni; }
    levelUp(after, newChar);
  }
  save(); render();
}
function levelUp(lvl, ch) {
  const box = ch != null

/* ------------------------- пошаговый датчик ------------------------- */
const pedo = { on: false, buf: 0, last: 0, f: 9.8, iv: null };
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a) return;
  const m = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2), now = Date.now();
  pedo.f = pedo.f * 0.9 + m * 0.1;
  if (m - pedo.f > 2.2 && now - pedo.last > 330) { pedo.last = now; pedo.buf++; }
}
async function sensorToggle() {
  if (pedo.on) { window.removeEventListener('devicemotion', onMotion); clearInterval(pedo.iv); pedo.on = false; return render(); }
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
      const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') return toast('Доступ к датчикам не выдан');
    }
    if (!('DeviceMotionEvent' in window)) return toast('Датчики не поддерживаются на этом устройстве');
    window.addEventListener('devicemotion', onMotion); pedo.on = true;
    pedo.iv = setInterval(() => { if (pedo.buf > 0) { const n = pedo.buf; pedo.buf = 0; addSteps(n, true); } }, 4000);
    render(); toast('Шагомер включён 👟');
  } catch (e) { toast('Не удалось включить датчик (нужен HTTPS и телефон)'); }
}
function addSteps(n, quiet = false) {
  const d = D(); d.steps += n;
  const bx = Math.floor(d.steps / CFG.stepXp), bc = Math.floor(d.steps / CFG.stepCoin);
  const dx = bx - d.sx, dc = bc - d.sc; d.sx = bx; d.sc = bc;
  if (dx > 0 || dc > 0) gain(dx, dc, `${n} шагов`, quiet); else { save(); render(); }
}

let restLeft = 0, restIv = null;
function rest(s) {
  clearInterval(restIv); restLeft = s;
  restIv = setInterval(() => { restLeft--; const e = $('#restT'); if (e) e.textContent = restLeft > 0 ? restLeft + ' c' : '—'; if (restLeft <= 0) { clearInterval(restIv); beep(); toast('Отдых окончен — вперёд! 💥'); } }, 1000);
}

/* ------------------------------ картинки ------------------------------ */
function resizeImg(file, max, cb) {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.7)); }; im.src = r.result; };
  r.readAsDataURL(file);
}
async function recognize() {
  if (!pendingPhoto) return toast('Сначала сделай фото');
  if (!S.settings.apiUrl) return toast('Подключи сервис распознавания в «Ещё → Настройки», пока — заполни вручную или выбери из базы');

}

/* ------------------------------ действия ------------------------------ */
const A = {
  nav: b => { tab = b.t; render(); window.scrollTo(0, 0); },
  close: () => $('#modal').classList.add('hidden'),
  bonus: () => { const s = streak(); S.lastBonus = dateKey(); gain(20, 10 + Math.min(s, 30) * 2, 'ежедневный бонус'); },
  quest: b => { const k = dateKey(), q = QUESTS[+b.id]; S.quests[k] = S.quests[k] || {}; if (S.quests[k][q.id]) return; S.quests[k][q.id] = 1; gain(q.xp, q.c, 'квест выполнен'); },
  steps: b => addSteps(+b.n),
  stepsCustom: () => { const n = Math.round(num($('#stepCustom').value)); if (n > 0) addSteps(n); },
  sensor: sensorToggle,
  fg: b => { trainG = b.v; render(); }, fe: b => { trainE = b.v; render(); },
  logEx: (b, el) => {
    const card = el.closest('.ex'), e = EXR[+card.dataset.id], sets = Math.max(1, Math.round(num($('.eS', card).value))), reps = Math.max(1, Math.round(num($('.eR', card).value)));
    S.workouts.push({ date: dateKey(), id: e.id, sets, reps, xp: e.xp * sets }); D().train++; gain(e.xp * sets, Math.ceil(sets / 2), e.n);
  },
  prog: b => {
    const p = PROGRAMS[+b.i]; let xp = 0, n = 0;
    p[1].forEach(nm => { const e = exByName(nm); if (e) { S.workouts.push({ date: dateKey(), id: e.id, sets: e.sets, reps: e.reps, xp: e.xp * e.sets }); xp += e.xp * e.sets; n++; D().train++; } });
    gain(xp + 50, 10 + n * 2, 'программа выполнена');
  },
  rest: b => rest(+b.s),
  rStart, rPause, rReset,
  rManual: () => {
    const m = Math.round(num($('#rmanMin').value)), pg = Math.round(num($('#rmanPg').value));
    if (m <= 0) return toast('Укажи минуты');
    S.reading.push({ date: dateKey(), min: m, title: ($('#rbook')?.value || '').trim(), pages: pg }); D().read += m; gain(m * 2, Math.floor(m / 5), 'чтение');
  },
  photo: () => $('#mealPhoto').click(), recognize,
  mealAdd: () => {
    const name = $('#fName').value.trim(); if (!name) return toast('Введи название');
    const m = { id: Date.now(), date: dateKey(), name, g: num($('#fGr').value), kcal: num($('#fKcal').value), p: num($('#fP').value), f: num($('#fF').value), c: num($('#fC').value), img: pendingPhoto };
    S.meals.push(m); D().meals++; pendingPhoto = null; gain(5, 1, 'приём пищи записан');
  },
  mealDel: b => { S.meals = S.meals.filter(m => m.id !== +b.id); save(); render(); },
  buy: b => { const it = [...SHOP, ...S.customShop].find(x => x.id === b.id); if (!it || S.coins < it.p) return; S.coins -= it.p; S.inventory[it.id] = (S.inventory[it.id] || 0) + 1; S.bought = (S.bought | 0) + 1; toast('Куплено: ' + it.n); save(); render(); },
  use: b => { if (!(S.inventory[b.id] > 0)) return; S.inventory[b.id]--; toast('Наслаждайся! Ты это заслужил(а) 🎉'); save(); render(); },
  addReward: () => {
    const n = $('#sNm').value.trim(), p = Math.round(num($('#sPr').value)); if (!n || p <= 0) return toast('Название и цена');
    S.customShop.push({ id: 'c' + Date.now(), em: $('#sEm').value.trim() || '🎁', n, p }); save(); render();
  },
  water: () => { const d = D(); d.water++; gain(3, 0, 'стакан воды'); },
  sleep: () => { const h = num($('#slp').value); if (h <= 0) return; const d = D(), first = !d.sleep; d.sleep = h; if (first) gain(h >= 7 ? 15 : 5, 0, 'сон записан'); else { save(); render(); } },
  weight: () => { const v = num($('#wt').value); if (v <= 0) return; S.weights.push({ date: dateKey(), v }); gain(5, 0, 'вес записан'); },
  note: () => { const k = dateKey(), t = $('#note').value.trim(), first = !S.notes[k]; S.notes[k] = t; if (first && t) gain(10, 1, 'заметка дня'); else { save(); toast('Сохранено'); } },
  pick: b => { S.active = +b.i; save(); render(); },
  uploadImg: () => $('#charImg').click(), delImg: () => { delete S.customImg[S.active]; save(); render(); },
  saveSet: () => {
    S.name = $('#sName').value.trim() || 'Герой'; S.stepGoal = Math.max(1000, Math.round(num($('#sGoal').value)) || 8000);
    S.goals = { kcal: num($('#gK').value) || 2200, p: num($('#gP').value) || 130, f: num($('#gF').value) || 70, c: num($('#gC').value) || 250 };
    S.settings.apiUrl = $('#sApi').value.trim(); save(); toast('Настройки сохранены'); document.activeElement.blur(); render();
  },
  theme: () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); render(); },
  export: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `fitquest-${dateKey()}.json`; a.click(); },
  import: () => $('#importFile').click(),
  reset: () => { if (confirm('Удалить весь прогресс? Это нельзя отменить.')) { localStorage.removeItem(KEY); S = defaults(); render(); } },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b.dataset, b); });
document.addEventListener('input', e => { if (e.target.id === 'fName' || e.target.id === 'fGr') fillFood(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rmin') { rt.min = +t.value; if (!rt.run) { rt.left = rt.min * 60; tickDisplay(); } }
  if (t.id === 'mealPhoto' && t.files[0]) resizeImg(t.files[0], 480, url => { pendingPhoto = url; $('#pprev').innerHTML = `<img src="${url}" style="max-width:100%;max-height:180px;border-radius:12px">`; toast('Фото добавлено'); });
  if (t.id === 'charImg' && t.files[0]) resizeImg(t.files[0], 420, url => { S.customImg[S.active] = url; save(); render(); });
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader(); r.onload = () => { try { S = Object.assign(defaults(), JSON.parse(r.result)); save(); render(); toast('Данные импортированы'); } catch (x) { toast('Не удалось прочитать файл'); } }; r.readAsText(t.files[0]);
  }
  t.value && /^(mealPhoto|charImg|importFile)$/.test(t.id) && (t.value = '');
});
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) render(); }, 50));

render();

</script>
</body>
</html>
